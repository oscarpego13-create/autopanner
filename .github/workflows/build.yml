name: Build AutoPanner (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: macOS VST3 + AU
    runs-on: macos-14

    steps:
      # ── 1. Checkout plugin repo ──────────────────────────────────────────
      - name: Checkout AutoPanner
        uses: actions/checkout@v4

      # ── 2. Clone iPlug2 (shallow, with submodules) ──────────────────────
      - name: Clone iPlug2
        run: |
          git clone --depth=1 https://github.com/iPlug2/iPlug2.git ../iPlug2
          cd ../iPlug2
          git submodule update --init --recursive --depth=1

      # ── 3. Cache VST3 SDK ─────────────────────────────────────────────────
      - name: Download IPlug SDKs (VST3)
        run: |
          cd ../iPlug2/Dependencies/IPlug
          chmod +x download-iplug-sdks.sh
          ./download-iplug-sdks.sh

      # ── 4. Copy Roboto font from iPlug2 examples ─────────────────────────
      - name: Copy font
        run: |
          mkdir -p resources/fonts
          cp ../iPlug2/Examples/IPlugEffect/resources/fonts/Roboto-Regular.ttf \
             resources/fonts/Roboto-Regular.ttf

      # ── 5. Configure CMake ────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DIPLUG2_DIR=${{ github.workspace }}/../iPlug2 \
            -DIGRAPHICS_BACKEND=NANOVG \
            -DIGRAPHICS_RENDERER=METAL \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DIPLUG2_DISABLE_DEPRECATION_WARNINGS=ON \
            -DIPLUG_DEPLOY_PLUGINS=OFF

      # ── 6. Build VST3 ─────────────────────────────────────────────────────
      - name: Build VST3
        run: |
          cmake --build build --config Release --target AutoPanner-vst3

      # ── 7. Build AU ───────────────────────────────────────────────────────
      - name: Build AU
        run: |
          cmake --build build --config Release --target AutoPanner-au

      # ── Debug: show build tree ────────────────────────────────────────────
      - name: Show build output
        if: always()
        run: find build -name "*.vst3" -o -name "*.component" 2>/dev/null | head -20 || echo "no plugins found"

      # ── 8. Collect artifacts ──────────────────────────────────────────────
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build -name "*.vst3"       -exec cp -r {} dist/ \; 2>/dev/null || true
          find build -name "*.component"  -exec cp -r {} dist/ \; 2>/dev/null || true
          echo "=== Built artifacts ==="
          ls -la dist/ || echo "(none found yet)"

      # ── 9. Upload ─────────────────────────────────────────────────────────
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AutoPanner-VST3-macOS-arm64
          path: dist/*.vst3
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: AutoPanner-AU-macOS-arm64
          path: dist/*.component
          if-no-files-found: warn
          retention-days: 30
